[package]
name = "slippay_2_0"
version = "0.1.0"
edition = "2021"

[dependencies]
# Integração com Solana
solana-client = "1.18.17"
solana-sdk = "1.18.17"

# Precisão financeira
rust_decimal = "1.33.0"

# Criptografia pós-quântica
pqcrypto = "0.7.2"

# Runtime assíncrono
tokio = { version = "1.37", features = ["full"] }

# Serialização e JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Banco de dados (opcional, para logs/auditoria)
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres"] }

# Segurança e qualidade
clippy = "0.1.62"
cargo-audit = "0.18.0"
